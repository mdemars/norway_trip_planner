<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Camping Trip Planner</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/auth.js"></script>
</head>
<body{% if local_dev %} class="local-dev"{% endif %}>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>Admin Panel</h1>
                    <p class="subtitle">Database entity management</p>
                </div>
                <div class="header-controls">
                    <div id="themeToggleContainer"></div>
                    <a href="/" class="btn btn-secondary btn-back">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back to Trips
                    </a>
                    {% if user_name %}
                    <div class="user-info">
                        {% if user_picture %}
                        <img src="{{ user_picture }}" alt="" class="user-avatar" referrerpolicy="no-referrer">
                        {% endif %}
                        <span class="user-name">{{ user_name }}</span>
                        <a href="/logout" class="btn btn-secondary btn-sm" style="text-decoration:none;">Logout</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </header>

        <div class="main-content">

            <!-- Tab bar -->
            <div class="admin-tabs" role="tablist">
                <button class="admin-tab active" data-tab="entities" role="tab">Entity Browser</button>
                <button class="admin-tab" data-tab="backup" role="tab">Database Backup</button>
                <button class="admin-tab" data-tab="stopfix" role="tab">Stop-Link Fix</button>
            </div>

            <!-- Tab: Entity Browser -->
            <div id="tab-entities" class="admin-tab-panel active">
                <div class="admin-controls">
                    <label for="entitySelect">Entity type:</label>
                    <select id="entitySelect">
                        <option value="">-- Select an entity --</option>
                    </select>
                    <span id="rowCount" class="row-count"></span>
                </div>
                <div id="tableContainer" class="admin-table-container">
                    <p class="admin-placeholder">Select an entity type to view its records.</p>
                </div>
            </div>

            <!-- Tab: Database Backup -->
            <div id="tab-backup" class="admin-tab-panel">
                <div class="backup-actions">
                    <button id="createBackupBtn" class="btn btn-primary">Create Backup</button>
                    <button id="exportJsonBtn" class="btn btn-secondary">Export all trips (JSON)</button>
                    <label class="btn btn-secondary" style="cursor:pointer;">
                        Upload &amp; Restore backup
                        <input type="file" id="uploadBackupInput" accept=".db" style="display:none;">
                    </label>
                    <label class="btn btn-secondary" style="cursor:pointer;">
                        Import trip from JSON
                        <input type="file" id="importTripInput" accept=".json" style="display:none;">
                    </label>
                </div>
                <div id="backupStatus" class="backup-status" style="display:none;"></div>
                <div id="backupsListContainer" class="admin-table-container" style="margin-top:12px;">
                    <p class="admin-placeholder">Loading backups&hellip;</p>
                </div>
            </div>

            <!-- Tab: Stop-Link Fix -->
            <div id="tab-stopfix" class="admin-tab-panel">
                <div class="admin-table-container">
                    <p class="admin-placeholder" style="font-style:italic;">Coming soon &mdash; describe the feature to enable it.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
